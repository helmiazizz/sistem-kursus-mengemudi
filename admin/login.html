<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Panca Sari Jaya</title>
    <link rel="icon" type="image/png" href="/images/favicon-64.png?v=3">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css?v=3.6.0">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-left">
            <div class="login-brand">
                <img src="/images/logo-psj.webp?v=3" alt="PSJ Logo" class="login-logo-img" width="72" height="48">
                <span>Panca Sari Jaya</span>
            </div>
            <div class="login-illustration">
                <div class="car-animation">
                    <i class="fas fa-car fa-3x"></i>
                    <div class="road"></div>
                </div>
            </div>
            <h2>Selamat Datang Kembali</h2>
            <p>Kelola kursus mengemudi, jadwal latihan, dan pengingat WhatsApp dari satu dashboard.</p>
        </div>
        <div class="login-right">
            <div class="login-form-wrapper">
                <h1>Login Admin</h1>
                <p class="login-subtitle">Masukkan kredensial Anda untuk melanjutkan</p>
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i> Username
                        </label>
                        <input type="text" id="username" name="username" placeholder="Masukkan username" required
                            autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" placeholder="Masukkan password"
                                required autocomplete="current-password">
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-error" id="loginError" style="display:none;">
                        <i class="fas fa-exclamation-circle"></i>
                        <span id="errorMessage"></span>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i>
                        Masuk
                    </button>
                </form>
                <a href="/" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    Kembali ke Beranda
                </a>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        fetch('/api/auth/check')
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/admin/dashboard';
                }
            })
            .catch(() => { });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            errorDiv.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = '/admin/dashboard';
                } else {
                    errorDiv.style.display = 'flex';
                    document.getElementById('errorMessage').textContent = result.message;
                }
            } catch (error) {
                errorDiv.style.display = 'flex';
                document.getElementById('errorMessage').textContent = 'Gagal terhubung ke server';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk';
            }
        });

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }
    </script>
</body>

</html>
